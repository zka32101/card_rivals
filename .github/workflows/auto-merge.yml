name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: |
          contains(steps.metadata.outputs.dependency-names, 'flutter') ||
          contains(steps.metadata.outputs.dependency-names, 'firebase') ||
          contains(steps.metadata.outputs.dependency-names, 'riverpod') ||
          contains(steps.metadata.outputs.dependency-names, 'typescript') ||
          contains(steps.metadata.outputs.dependency-names, 'firebase-admin') ||
          contains(steps.metadata.outputs.dependency-names, 'firebase-functions')
